name: Build and Deploy Investor Platform to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: investingAssistant
  AKS_RESOURCE_GROUP: rg-utsav10paneru
  AKS_CLUSTER_NAME: investingassistance
  IMAGE_NAME: investor-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Get the Azure Container Registry login server
      - name: Get ACR login server
        id: acr
        shell: bash
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          echo "login-server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      # 4. Log in to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      # 5. Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.acr.outputs.login-server }}/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "${{ steps.acr.outputs.login-server }}/$IMAGE_NAME:latest" \
            .

      # 6. Push both image tags to ACR
      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.acr.outputs.login-server }}/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "${{ steps.acr.outputs.login-server }}/$IMAGE_NAME:latest"

      # 7. Connect to Azure Kubernetes Service
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      # 8. Update the image used by your Kubernetes Deployment
      - name: Deploy to AKS
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login-server }}
          K8S_DEPLOYMENT: investor-platform
          K8S_CONTAINER: investor-platform
        run: |
          kubectl set image \
            "deployment/$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

      # 9. Wait for the deployment to finish
      - name: Verify deployment
        run: |
          kubectl rollout status \
            "deployment/investor-platform" \
            --timeout=180s

          kubectl get pods
          kubectl get services
