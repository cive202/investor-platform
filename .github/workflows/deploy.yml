name: Build and Deploy AKS

on:
  push:
    branches:
      - cicd

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}


      - name: Docker Login to ACR
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.ACR_USERNAME}} \
            -p ${{ secrets.ACR_PASSWORD}}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER}}/investor-platform:v1 .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER}}/investor-platform:v1

      - name: GET AKS CREDENTIALS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP}} \
            --name ${{ secrets.AKS_CLUSTER_NAME}} \
            --overwrite-existing

      - name: Create Kubernetes Secrets
        run: |
          kubectl create secret generic investor-env \
            --from-literal=AZURE_EMBEDDING_MODEL_NAME="${{ secrets.AZURE_EMBEDDING_MODEL_NAME }}" \
            --from-literal=AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
            --from-literal=AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
            --from-literal=AZURE_OPENAI_CHAT_ENDPOINT="${{ secrets.AZURE_OPENAI_CHAT_ENDPOINT }}" \
            --from-literal=AZURE_OPENAI_CHAT_API_KEY="${{ secrets.AZURE_OPENAI_CHAT_API_KEY }}" \
            --from-literal=AZURE_OPENAI_CHAT_API_VERSION="${{ secrets.AZURE_OPENAI_CHAT_API_VERSION }}" \
            --from-literal=OPENAI_API_VERSION="${{ secrets.OPENAI_API_VERSION }}" \
            --from-literal=AZURE_OPENAI_CHAT_DEPLOYMENT="${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}" \
            --from-literal=AZURE_SEARCH_API_KEY="${{ secrets.AZURE_SEARCH_API_KEY }}" \
            --from-literal=AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
            --from-literal=AZURE_SEARCH_INDEX_NAME="${{ secrets.AZURE_SEARCH_INDEX_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
            --from-literal=POSTGRES_DATABASE="${{ secrets.POSTGRES_DATABASE }}" \
            --from-literal=POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/investing-assistant

      - name: Verfiy deployment
        run: |
          kubectl rollout status deployment/investing-assistant
