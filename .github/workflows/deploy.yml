name: Build and Deploy AKS

on:
  push:
    branches:
      - cicd

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az cr login --name ${{ secrets.ACR_NAME }}


      - name: Docker Login to ACR
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.ACR_USERNAME}} \
            -p ${{ secrets.ACR_PASSWORD}}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER}}/investor-platform:v1 .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER}}/investor-platform:v1

      - name: GET AKS CREDENTIALS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP}} \
            --name ${{ secrets.AKS_CLUSTER_NAME}} \
            --overwrite-existing

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/investingAssistant

      - name: Verfiy deployment
        run: |
          kubectl rollout status deployment/investingAssistant
