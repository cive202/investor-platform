apiVersion: apps/v1
kind: Deployment

metadata:
  name: investingAssistant

spec:
  replicas: 1

  selector:
    matchLabels:
      app: investingAssistant

  template:
    metadata:
      labels:
        app: investingAssistant

    spec:
      containers:
      - name: investingAssistant

        image: investingassistant.azurecr.io/investor-platform:v1

        imagePullPolicy: Always

        envFrom:
        - secretRef:
            name: investor-env

        ports:
        - containerPort: 8000
