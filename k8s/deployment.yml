apiVersion: apps/v1
kind: Deployment

metadata:
  name: cive-investor

specs:
  replicas: 1

  selector:
    matchLables:
      app: cive-investor

  template:
    metadata:
      labels:
        app: cive-investor

    spec:
      containers:
      - name: cive-investor

        image: investingassistant.azurecr.io/investor-platform:v1

        imagePullPolicy: Always

        envFrom:
        - secretRef:
            name: investor-env

        ports:
        - containerPort: 8000
